<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="t-iec104normalkonusmaen" font-family="'Trebuchet MS',Arial,sans-serif"><title id="t-iec104normalkonusmaen">IEC 60870-5-104: the normal conversation between center and RTU</title><rect width="980" height="560" fill="#e9e9dd" rx="16"/><text x="40" y="42" font-size="18" fill="#28352e" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">IEC 60870-5-104: the normal conversation between center and RTU</text><text x="40" y="76" font-size="13" fill="#607c79" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">Request — Center → RTU (general interrogation)</text><rect x="40" y="88" width="170" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="125.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">APCI</text><text x="125.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">0x68 · I-format</text><rect x="218" y="88" width="170" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="303.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">TypeID</text><text x="303.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">100 (C_IC_NA_1)</text><rect x="396" y="88" width="128" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="460.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Cause (COT)</text><text x="460.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">Act (6)</text><rect x="532" y="88" width="128" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="596.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">ASDU address</text><text x="596.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1</text><rect x="668" y="88" width="128" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="732.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">IOA</text><text x="732.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">0</text><rect x="804" y="88" width="170" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="889.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">QOI</text><text x="889.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">20 (station)</text><text x="40" y="172" font-size="13" fill="#607c79" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">Response — RTU → Center (confirmation)</text><rect x="40" y="184" width="170" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="125.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">APCI</text><text x="125.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">0x68 · I-format</text><rect x="218" y="184" width="170" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="303.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">TypeID</text><text x="303.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">100 (C_IC_NA_1)</text><rect x="396" y="184" width="128" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="460.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Cause (COT)</text><text x="460.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">ActCon (7)</text><rect x="532" y="184" width="128" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="596.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">ASDU address</text><text x="596.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1</text><rect x="668" y="184" width="128" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="732.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">IOA</text><text x="732.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">0</text><rect x="804" y="184" width="170" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="889.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">QOI</text><text x="889.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">20 (station)</text><rect x="40" y="264" width="900" height="160" rx="12" fill="#fff7e0" stroke="#b7791f" stroke-width="1.4"/><text x="60" y="292" font-size="20" fill="#b7791f" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">!</text><text x="86" y="290" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">This is the center saying &quot;report your whole current status&quot; and the RTU confirming. This is the traffic</text><text x="86" y="312" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">we allow to the RTU through the firewall: a defined port (2404) and defined types. The 2010 VxWorks debug</text><text x="86" y="334" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">service (17185/udp) is not part of this conversation; it is a separate door that should be closed.</text><text x="40" y="500" font-size="12" fill="#687165" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">Synthetic frames; decoded from file with TShark 4.2.2. Not transmitted, no real device.</text><text x="40" y="528" font-size="11" fill="#687165" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">selmanbagirici.com · OTB-2026-011 · laboratuvar</text></svg>
