<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">İç tutarlılık ve harici semantik doğruluk</title><desc id="desc">Kod ve testin aynı yanlış varsayımı paylaşarak yeşil kalabildiğini, harici oracle'ın bu döngüyü kırdığını anlatır.</desc>
  <rect width="1600" height="900" fill="#081a28"/><text x="80" y="86" fill="#f8fafc" font-family="Inter,Arial" font-size="44" font-weight="750">Testler yeşil. Davranış ters. / Green tests. Wrong behavior.</text>
  <text x="80" y="132" fill="#a7bfcc" font-family="Inter,Arial" font-size="23">Aynı varsayımı paylaşan kod ve test birbirini doğrulayabilir; gerçeği değil.</text>
  <g font-family="Inter,Arial"><rect x="90" y="205" width="650" height="475" rx="34" fill="#102c3d" stroke="#4ade80" stroke-width="3"/><text x="135" y="263" fill="#86efac" font-size="22" font-weight="700">İÇ DÖNGÜ / INTERNAL LOOP</text><circle cx="280" cy="405" r="112" fill="#163f3b" stroke="#4ade80" stroke-width="4"/><text x="280" y="392" text-anchor="middle" fill="#f8fafc" font-size="31" font-weight="750">CODE</text><text x="280" y="430" text-anchor="middle" fill="#86efac" font-size="23">✓ PASS</text><circle cx="550" cy="405" r="112" fill="#163f3b" stroke="#4ade80" stroke-width="4"/><text x="550" y="392" text-anchor="middle" fill="#f8fafc" font-size="31" font-weight="750">TEST</text><text x="550" y="430" text-anchor="middle" fill="#86efac" font-size="23">✓ PASS</text><path d="M392 380h45" stroke="#4ade80" stroke-width="6"/><path d="M438 442h-45" stroke="#4ade80" stroke-width="6"/><rect x="175" y="565" width="480" height="70" rx="18" fill="#25433d"/><text x="415" y="594" text-anchor="middle" fill="#d1fae5" font-size="18">Shared assumption / Ortak varsayım</text><text x="415" y="620" text-anchor="middle" fill="#86efac" font-size="17">“Label A means behavior A”</text>
  <rect x="860" y="205" width="650" height="475" rx="34" fill="#102c3d" stroke="#fb7185" stroke-width="3"/><text x="905" y="263" fill="#fda4af" font-size="22" font-weight="700">HARİCİ ORACLE / EXTERNAL ORACLE</text><g transform="translate(930 315)"><rect width="220" height="90" rx="18" fill="#1b3a4a"/><text x="110" y="38" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="700">SPEC / VENDOR</text><text x="110" y="66" text-anchor="middle" fill="#d8e7ee" font-size="16">Normative meaning</text><rect y="120" width="220" height="90" rx="18" fill="#1b3a4a"/><text x="110" y="158" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="700">CAPTURE</text><text x="110" y="186" text-anchor="middle" fill="#d8e7ee" font-size="16">Observed bytes</text><rect y="240" width="220" height="90" rx="18" fill="#1b3a4a"/><text x="110" y="278" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="700">DEVICE EFFECT</text><text x="110" y="306" text-anchor="middle" fill="#d8e7ee" font-size="16">Observed outcome</text></g><path d="M1180 360h130M1180 480h130M1180 600h130" stroke="#fb7185" stroke-width="4"/><rect x="1310" y="365" width="145" height="205" rx="22" fill="#4a2530"/><text x="1382" y="438" text-anchor="middle" fill="#fda4af" font-size="20" font-weight="700">SEMANTIC</text><text x="1382" y="470" text-anchor="middle" fill="#fda4af" font-size="20" font-weight="700">CHECK</text><text x="1382" y="525" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">A ≠ B</text></g>
  <path d="M745 440h100" stroke="#fbbf24" stroke-width="6" stroke-dasharray="12 10"/><text x="795" y="420" text-anchor="middle" fill="#fcd34d" font-family="Inter,Arial" font-size="18" font-weight="700">COMPARE</text>
  <rect x="90" y="740" width="1420" height="92" rx="24" fill="#f8fafc"/><text x="800" y="785" text-anchor="middle" fill="#20313b" font-family="Inter,Arial" font-size="25" font-weight="750">Yeşil test yalnız ölçtüğü şey için kanıttır. / A green test is evidence only for what it actually measures.</text><text x="800" y="817" text-anchor="middle" fill="#687983" font-family="Inter,Arial" font-size="17">Syntax · semantics · operational effect are different claims.</text>
</svg>
