<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="t-s7commkimlikyoken" font-family="'Trebuchet MS',Arial,sans-serif"><title id="t-s7commkimlikyoken">An S7comm connection: no authentication field in the packet</title><rect width="980" height="560" fill="#e9e9dd" rx="16"/><text x="40" y="42" font-size="18" fill="#28352e" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">An S7comm connection: no authentication field in the packet</text><text x="40" y="76" font-size="13" fill="#607c79" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">Frame 1 — COTP connection request (TPKT + COTP CR, destination port 102)</text><rect x="40" y="88" width="150" height="54" rx="6" fill="#fff" stroke="#c7c7b7" stroke-width="1.3"/><text x="115.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">TPKT</text><text x="115.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">version 3</text><rect x="198" y="88" width="150" height="54" rx="6" fill="#fff" stroke="#c7c7b7" stroke-width="1.3"/><text x="273.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">COTP</text><text x="273.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">CR connect</text><rect x="356" y="88" width="150" height="54" rx="6" fill="#fff" stroke="#c7c7b7" stroke-width="1.3"/><text x="431.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">TPDU size</text><text x="431.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1024</text><rect x="514" y="88" width="160" height="54" rx="6" fill="#fff" stroke="#c7c7b7" stroke-width="1.3"/><text x="594.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Source TSAP</text><text x="594.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">0x0100</text><rect x="682" y="88" width="160" height="54" rx="6" fill="#fff" stroke="#c7c7b7" stroke-width="1.3"/><text x="762.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Dest TSAP</text><text x="762.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">0x0301 (rack/slot)</text><text x="40" y="172" font-size="13" fill="#607c79" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">Frame 2 — S7 &quot;Setup communication&quot; job (negotiating the PDU size)</text><rect x="40" y="184" width="168" height="54" rx="6" fill="#fff" stroke="#c7c7b7" stroke-width="1.3"/><text x="124.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Protocol</text><text x="124.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">0x32</text><rect x="216" y="184" width="150" height="54" rx="6" fill="#fff" stroke="#c7c7b7" stroke-width="1.3"/><text x="291.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">ROSCTR</text><text x="291.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">Job (1)</text><rect x="374" y="184" width="168" height="54" rx="6" fill="#fff" stroke="#c7c7b7" stroke-width="1.3"/><text x="458.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Function</text><text x="458.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">Setup comm 0xF0</text><rect x="550" y="184" width="150" height="54" rx="6" fill="#fff" stroke="#c7c7b7" stroke-width="1.3"/><text x="625.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Parallel jobs</text><text x="625.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1 / 1</text><rect x="708" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="783.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">PDU length</text><text x="783.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">480</text><rect x="40" y="264" width="900" height="150" rx="12" fill="#fff7e0" stroke="#b7791f" stroke-width="1.4"/><text x="60" y="292" font-size="20" fill="#b7791f" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">!</text><text x="86" y="290" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">The whole connection negotiates one thing: the PDU size. There is no username, password or challenge</text><text x="86" y="312" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">field. &quot;Who may send this request&quot; is answered not by the packet but by the CPU access level and PUT/GET</text><text x="86" y="334" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">setting.</text><text x="40" y="500" font-size="12" fill="#687165" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">Synthetic frame; decoded from file with TShark 4.2.2. Not transmitted, no real device.</text><text x="40" y="528" font-size="11" fill="#687165" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">selmanbagirici.com · OTB-2026-010 · laboratuvar</text></svg>
