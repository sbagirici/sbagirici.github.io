<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="t-modbusokuma" font-family="'Trebuchet MS',Arial,sans-serif"><title id="t-modbusokuma">Modbus/TCP: makine dairesinde sıradan bir okuma</title><rect width="980" height="560" fill="#e9e9dd" rx="16"/><text x="40" y="42" font-size="18" fill="#28352e" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">Modbus/TCP: makine dairesinde sıradan bir okuma</text><text x="40" y="76" font-size="13" fill="#607c79" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">İstek — izleme → kontrolör (port 502)</text><rect x="40" y="88" width="130" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="105.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">İşlem no</text><text x="105.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1</text><rect x="178" y="88" width="130" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="243.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Birim</text><text x="243.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1</text><rect x="316" y="88" width="190" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="411.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Fonksiyon</text><text x="411.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">3 · Holding reg. oku</text><rect x="514" y="88" width="130" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="579.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Başlangıç</text><text x="579.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">100</text><rect x="652" y="88" width="130" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="717.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Adet</text><text x="717.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">2</text><text x="40" y="172" font-size="13" fill="#607c79" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">Yanıt — kontrolör → izleme</text><rect x="40" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="115.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">İşlem no</text><text x="115.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1</text><rect x="198" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="273.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Fonksiyon</text><text x="273.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">3</text><rect x="356" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="431.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Bayt</text><text x="431.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">4</text><rect x="514" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="589.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Reg 100</text><text x="589.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">750</text><rect x="672" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="747.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Reg 101</text><text x="747.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">320</text><rect x="40" y="264" width="900" height="160" rx="12" fill="#fff7e0" stroke="#b7791f" stroke-width="1.4"/><text x="60" y="292" font-size="20" fill="#b7791f" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">!</text><text x="86" y="290" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">Normal bir veri okuması: &quot;100. register&#x27;dan iki değer ver.&quot; Değerler örnektir (ör. bir devir ya da bir</text><text x="86" y="312" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">seviye). Pakette kimlik doğrulaması yoktur; bu segmente ulaşan herkes okuyabilir, çoğu üründe yazabilir</text><text x="86" y="334" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">de. Bu yüzden mürettebat ağı ile makine kontrol ağının aynı switch&#x27;te olmaması gerekir.</text><text x="40" y="500" font-size="12" fill="#687165" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">Sentetik çerçeveler; dosyadan TShark 4.2.2 ile çözümlendi. Register değerleri örnektir; ağa gönderilmedi, gerçek cihaz yok.</text><text x="40" y="528" font-size="11" fill="#687165" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">selmanbagirici.com · OTB-2026-012 · laboratuvar</text></svg>
