<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="dcp-topo-title dcp-topo-desc" font-family="Segoe Print, Chalkboard, DejaVu Sans, sans-serif">
<title id="dcp-topo-title">Local DCP path in a production cell</title>
<desc id="dcp-topo-desc">Illustrative device topology. A compromised engineering workstation reaches a PROFINET field device through the cell switch, bypassing the uplink firewall and PLC programming interface. The source can send DCP and the target accepts the relevant write. A SPAN link copies local traffic to an OT sensor. No port isolation or local Ethernet filtering is assumed; icons do not identify a private deployment.</desc>
