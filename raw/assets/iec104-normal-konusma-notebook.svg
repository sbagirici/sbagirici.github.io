t x="396" y="184" width="128" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="460.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Sebep (COT)</text><text x="460.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">ActCon (7)</text><rect x="532" y="184" width="128" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="596.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">ASDU adresi</text><text x="596.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1</text><rect x="668" y="184" width="128" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="732.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">IOA</text><text x="732.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">0</text><rect x="804" y="184" width="170" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="889.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">QOI</text><text x="889.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">20 (istasyon)</text><rect x="40" y="264" width="900" height="160" rx="12" fill="#fff7e0" stroke="#b7791f" stroke-width="1.4"/><text x="60" y="292" font-size="20" fill="#b7791f" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">!</text><text x="86" y="290" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">Bu, merkezin &quot;bana bütün güncel durumu bildir&quot; demesi ve RTU&#x27;nun onaylaması. Güvenlik duvarında RTU&#x27;ya</text><text x="86" y="312" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">izin verdiğimiz trafik budur: tanımlı port (2404) ve tanımlı tipler. 2010&#x27;daki VxWorks hata ayıklama</text><text x="86" y="334" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">servisi (17185/udp) bu konuşmanın parçası değildir; ayrı ve kapatılması gereken bir kapıdır.</text><text x="40" y="500" font-size="12" fill="#687165" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">Sentetik çerçeveler; dosyadan TShark 4.2.2 ile çözümlendi. Ağa gönderilmedi, gerçek cihaz yok.</text><text x="40" y="528" font-size="11" fill="#687165" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">selmanbagirici.com · OTB-2026-011 · laboratuvar</text></svg>
