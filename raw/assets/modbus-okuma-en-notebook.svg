<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="t-modbusokumaen" font-family="'Trebuchet MS',Arial,sans-serif"><title id="t-modbusokumaen">Modbus/TCP: an ordinary read in the engine room</title><rect width="980" height="560" fill="#e9e9dd" rx="16"/><text x="40" y="42" font-size="18" fill="#28352e" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">Modbus/TCP: an ordinary read in the engine room</text><text x="40" y="76" font-size="13" fill="#607c79" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">Request — monitoring → controller (port 502)</text><rect x="40" y="88" width="130" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="105.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Trans. id</text><text x="105.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1</text><rect x="178" y="88" width="130" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="243.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Unit</text><text x="243.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1</text><rect x="316" y="88" width="190" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="411.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Function</text><text x="411.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">3 · Read holding reg.</text><rect x="514" y="88" width="130" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="579.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Start</text><text x="579.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">100</text><rect x="652" y="88" width="130" height="54" rx="6" fill="#e3f0fa" stroke="#607c79" stroke-width="1.3"/><text x="717.0" y="106" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Count</text><text x="717.0" y="133" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">2</text><text x="40" y="172" font-size="13" fill="#607c79" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">Response — controller → monitoring</text><rect x="40" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="115.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Trans. id</text><text x="115.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">1</text><rect x="198" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="273.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Function</text><text x="273.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">3</text><rect x="356" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="431.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Bytes</text><text x="431.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">4</text><rect x="514" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="589.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Reg 100</text><text x="589.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">750</text><rect x="672" y="184" width="150" height="54" rx="6" fill="#e4e8dc" stroke="#607c79" stroke-width="1.3"/><text x="747.0" y="202" font-size="11" fill="#687165" text-anchor="middle" font-family="'Trebuchet MS',Arial,sans-serif">Reg 101</text><text x="747.0" y="229" font-size="13" fill="#28352e" text-anchor="middle" font-weight="bold" font-family="'DejaVu Sans Mono',monospace">320</text><rect x="40" y="264" width="900" height="160" rx="12" fill="#fff7e0" stroke="#b7791f" stroke-width="1.4"/><text x="60" y="292" font-size="20" fill="#b7791f" text-anchor="start" font-weight="bold" font-family="'Trebuchet MS',Arial,sans-serif">!</text><text x="86" y="290" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">A normal data read: &quot;give me two values from register 100.&quot; The values are illustrative (e.g. a speed or</text><text x="86" y="312" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">a level). There is no authentication in the packet; anyone who reaches this segment can read, and on most</text><text x="86" y="334" font-size="15" fill="#28352e" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">products write too. That is why the crew network and the engine control network must not share a switch.</text><text x="40" y="500" font-size="12" fill="#687165" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">Synthetic frames; decoded from file with TShark 4.2.2. Register values are illustrative; not transmitted, no real device.</text><text x="40" y="528" font-size="11" fill="#687165" text-anchor="start" font-family="'Trebuchet MS',Arial,sans-serif">selmanbagirici.com · OTB-2026-012 · laboratuvar</text></svg>
