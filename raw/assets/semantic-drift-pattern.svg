<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Aynı gerçeğin kopyaları zamanla ayrışır</title><desc id="desc">Tek bir protokol gerçeğinin istemci, dissector, builder ve tespit kuralına kopyalanarak drift üretmesini gösterir.</desc>
  <rect width="1600" height="720" fill="#f3eee4"/><text x="80" y="82" fill="#20251f" font-family="Inter,Arial" font-size="42" font-weight="750">Bir gerçek, dört kopya / One fact, four copies</text><text x="80" y="125" fill="#686961" font-family="Inter,Arial" font-size="21">Düzeltme bir kopyaya ulaşınca diğerleri otomatik olarak doğru olmaz.</text>
  <g font-family="Inter,Arial"><circle cx="800" cy="345" r="115" fill="#20251f"/><text x="800" y="330" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">WIRE</text><text x="800" y="365" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700">SEMANTICS</text><text x="800" y="401" text-anchor="middle" fill="#fbbf24" font-size="17">single authority?</text>
  <g><rect x="100" y="225" width="290" height="110" rx="22" fill="#d9eef5"/><text x="245" y="272" text-anchor="middle" fill="#1b5068" font-size="21" font-weight="700">CLIENT</text><text x="245" y="304" text-anchor="middle" fill="#506875" font-size="16">sends an action</text><path d="M390 280L675 330" stroke="#7b8790" stroke-width="4"/></g>
  <g><rect x="100" y="405" width="290" height="110" rx="22" fill="#d8eee8"/><text x="245" y="452" text-anchor="middle" fill="#176b66" font-size="21" font-weight="700">DISSECTOR</text><text x="245" y="484" text-anchor="middle" fill="#506875" font-size="16">labels observed bytes</text><path d="M390 460L685 380" stroke="#7b8790" stroke-width="4"/></g>
  <g><rect x="1210" y="225" width="290" height="110" rx="22" fill="#f5e8bd"/><text x="1355" y="272" text-anchor="middle" fill="#8a5b08" font-size="21" font-weight="700">BUILDER</text><text x="1355" y="304" text-anchor="middle" fill="#6b624f" font-size="16">creates test traffic</text><path d="M1210 280L925 330" stroke="#7b8790" stroke-width="4"/></g>
  <g><rect x="1210" y="405" width="290" height="110" rx="22" fill="#f2d9d2"/><text x="1355" y="452" text-anchor="middle" fill="#a4462a" font-size="21" font-weight="700">DETECTION</text><text x="1355" y="484" text-anchor="middle" fill="#6b5a54" font-size="16">matches a meaning</text><path d="M1210 460L915 380" stroke="#7b8790" stroke-width="4"/></g></g>
  <rect x="110" y="580" width="1380" height="72" rx="20" fill="#a4462a"/><text x="800" y="624" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="23" font-weight="700">Çözüm / Remedy: tek otorite + üretilen temsiller + bağımsız çapraz doğrulama</text>
</svg>
