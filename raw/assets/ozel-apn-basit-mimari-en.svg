<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 440" role="img" aria-labelledby="apn-architecture-title apn-architecture-desc"><title id="apn-architecture-title">Simple private APN architecture</title><desc id="apn-architecture-desc">A field RTU reaches central SCADA through a cellular router, base station, operator network and enterprise firewall. The private APN is the operator’s connection and routing arrangement, not a physical appliance. The enterprise handoff depends on the service.</desc><defs>
