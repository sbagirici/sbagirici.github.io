 <g id="apn-architecture-tower" fill="none" stroke="#19334a" stroke-width="2.2" stroke-linecap="round"><path d="M49 12L26 77M49 12L73 78M38 44h24M33 60h34M38 44l28 16M61 44L34 60" /><path d="M29 24Q11 10 29 0M69 24Q87 10 69 0M36 20Q26 10 36 4M62 20Q72 10 62 4" /></g></defs><rect width="1100" height="440" rx="18" fill="#f0f6fb" /><g font-family="DejaVu Sans, sans-serif" fill="#19334a"><text x="38" y="43" text-anchor="start" font-size="25" fill="#19334a" font-weight="bold">Cellular connection from field to center</text><text x="38" y="72" text-anchor="start" font-size="16" fill="#526779" font-weight="normal">Example architecture • connection type and permissions depend on the operator service</text><path d="M368 106L767 108L765 324L366 321Z" fill="#e4eef8" stroke="#7e9bb5" stroke-width="1.6" stroke-dasharray="8 7" /><text x="565" y="136" text-anchor="middle" font-size="18" fill="#19334a" font-weight="bold">Operator network</text><use xlink:href="#apn-architecture-plc" transform="translate(42 191) scale(1)" /><use xlink:href="#apn-architecture-router" transform="translate(211 190) scale(1)" /><use xlink:href="#apn-architecture-tower" transform="translate(390 184) scale(1)" /><use xlink:href="#apn-architecture-fw" transform="translate(819 191) scale(1)" /><use xlink:href="#apn-architecture-screen" transform="translate(974 191) scale(1)" /><path d="M133 229L215 229" fill="none" stroke="#196baf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-architecture-blue)" /><path d="M306 229Q343 214 392 225" fill="none" stroke="#196baf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#apn-architecture-blue)" /><path d="M489 229L530 229" fill="none" stroke="#196baf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-architecture-blue)" /><path d="M737 229L819 229" fill="none" stroke="#196baf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-architecture-blue)" /><path d="M913 229L974 229" fill="none" stroke="#196baf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-architecture-blue)" /><path d="M535 173L738 176L735 282L534 279Z" fill="#fff" stroke="#19334a" stroke-width="2.1" /><text x="635" y="207" text-anchor="middle" font-size="22" fill="#19334a" font-weight="bold">Private APN</text><text x="635" y="237" text-anchor="middle" font-size="17" fill="#19334a" font-weight="normal">SIM admission</text><text x="635" y="260" text-anchor="middle" font-size="16" fill="#19334a" font-weight="normal">Routing / policy</text><text x="89" y="303" text-anchor="middle" font-size="18" fill="#19334a" font-weight="bold">RTU / PLC</text><text x="259" y="303" text-anchor="middle" font-size="18" fill="#19334a" font-weight="bold">Cellular router</text><text x="439" y="303" text-anchor="middle" font-size="17" fill="#19334a" font-weight="normal">Base station</text><text x="866" y="303" text-anchor="middle" font-size="16" fill="#19334a" font-weight="normal">Firewall</text><text x="1022" y="303" text-anchor="middle" font-size="18" fill="#19334a" font-weight="bold">SCADA</text><text x="346" y="179" text-anchor="middle" font-size="14" fill="#526779" font-weight="normal">Radio</text><text x="782" y="179" text-anchor="middle" font-size="14" fill="#526779" font-weight="normal">Enterprise</text><text x="782" y="196" text-anchor="middle" font-size="14" fill="#526779" font-weight="normal">handoff</text><text x="38" y="372" text-anchor="start" font-size="23" fill="#19334a" font-weight="bold">SIM admission ≠ permission to operate on other endpoints</text><text x="38" y="403" text-anchor="start" font-size="16" fill="#526779" font-weight="normal">Encryption scope is not shown; assess APN, VPN and application protection separately.</text></g></svg>