 <g id="apn-architecture-fw" fill="#fff" stroke="#19334a" stroke-width="2.2" stroke-linecap="round"><path d="M7 10L88 8L90 64L8 67Z" /><path d="M8 28h81M8 46h81M28 10v18M68 9v19M48 28v18M29 46v20M69 46v19" /><path d="M19 75h59" /></g>
