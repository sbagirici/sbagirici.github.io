<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t-interneteacikplcyolen" font-family="'Trebuchet MS',Arial,sans-serif"><title id="t-interneteacikplcyolen">Two paths from the internet to a PLC</title><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#28352e"/></marker><marker id="mr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c5940"/></marker><marker id="mb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#607c79"/></marker></defs><rect width="960" height="540" fill="#e9e9dd" rx="16"/><text x="40" y="48" font-size="16" fill="#8c5940" text-anchor="start" font-weight="bold">A common arrangement in the field today</text><rect x="40" y="70" width="150" height="64" rx="10" fill="#fff" stroke="#28352e" stroke-width="1.6"/><text x="115.0" y="98.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#28352e">Scanning service</text><text x="115.0" y="117.0" text-anchor="middle" font-size="12" fill="#687165">Censys / ZoomEye</text><text x="115" y="155" font-size="12" fill="#687165" text-anchor="middle">&quot;is 102 open?&quot;</text><line x1="190" y1="102" x2="250" y2="102" stroke="#8c5940" stroke-width="2.2" marker-end="url(#mr)"/><ellipse cx="305" cy="102" rx="55" ry="30" fill="#fff" stroke="#28352e" stroke-width="1.6"/><text x="305" y="107" font-size="14" fill="#28352e" text-anchor="middle" font-weight="bold">Internet</text><line x1="360" y1="102" x2="420" y2="102" stroke="#8c5940" stroke-width="2.2" marker-end="url(#mr)"/><rect x="420" y="70" width="150" height="64" rx="10" fill="#fff" stroke="#28352e" stroke-width="1.6"/><text x="495.0" y="98.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#28352e">Cellular modem</text><text x="495.0" y="117.0" text-anchor="middle" font-size="12" fill="#687165">field site</text><line x1="570" y1="102" x2="620" y2="102" stroke="#8c5940" stroke-width="2.2" marker-end="url(#mr)"/><rect x="620" y="70" width="140" height="64" rx="10" fill="#fde7ea" stroke="#8c5940" stroke-width="1.6"/><text x="690.0" y="98.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#28352e">Port forwarding</text><text x="690.0" y="117.0" text-anchor="middle" font-size="12" fill="#687165">102 → PLC</text><line x1="760" y1="102" x2="800" y2="102" stroke="#8c5940" stroke-width="2.2" marker-end="url(#mr)"/><rect x="800" y="70" width="120" height="64" rx="10" fill="#fde7ea" stroke="#8c5940" stroke-width="1.6"/><text x="860.0" y="98.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#28352e">PLC</text><text x="860.0" y="117.0" text-anchor="middle" font-size="12" fill="#687165">S7comm, TCP 102</text><text x="860" y="156" font-size="12" fill="#8c5940" text-anchor="middle">Access protection:</text><text x="860" y="171" font-size="12" fill="#8c5940" text-anchor="middle">&quot;full access, no protection&quot;</text><text x="480" y="185" font-size="13" fill="#8c5940" text-anchor="middle">The PLC itself is the only place that asks for identity</text><line x1="40" y1="215" x2="920" y2="215" stroke="#c7c7b7" stroke-width="1"/><text x="40" y="258" font-size="16" fill="#607c79" text-anchor="start" font-weight="bold">What it should look like</text><rect x="40" y="280" width="150" height="64" rx="10" fill="#fff" stroke="#28352e" stroke-width="1.6"/><text x="115.0" y="308.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#28352e">Scanning service</text><text x="115.0" y="327.0" text-anchor="middle" font-size="12" fill="#687165">Censys / ZoomEye</text><line x1="190" y1="312" x2="250" y2="312" stroke="#607c79" stroke-width="2.2" marker-end="url(#mb)"/><ellipse cx="305" cy="312" rx="55" ry="30" fill="#fff" stroke="#28352e" stroke-width="1.6"/><text x="305" y="317" font-size="14" fill="#28352e" text-anchor="middle" font-weight="bold">Internet</text><line x1="360" 