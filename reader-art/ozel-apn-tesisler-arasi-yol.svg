<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 740" role="img" aria-labelledby="apn-lateral-title apn-lateral-desc"><title id="apn-lateral-title">Bir saha ucundan diğer tesisin yönetimine</title><desc id="apn-lateral-desc">CERT Polska raporundan sadeleştirilmiş bağlantı. Tesis A’daki firewall/VPN cihazından router’ın Ethernet yönetimine erişilir; router RTU’yla seri DNP3 haberleşir. Özel APN üzerinden Tesis B’nin kontrolör/gateway yönetimine erişilebilir. Gateway yerel SCADA ve proses ağına bağlıdır; tünel kullanımı olasılıklı rapor yorumudur. Mavi merkez telekontrolü; kırmızı tesisler arası yönetim yoludur.</desc><defs>
 <marker id="apn-lateral-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#517274" stroke-width="1.7"/></marker>
 <marker id="apn-lateral-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#984c42" stroke-width="1.7"/></marker>
 <g id="apn-lateral-router" fill="#f4f1e8" stroke="#454d43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 25L89 23L92 66L7 68Z"/><path d="M8 28L87 27L89 63" opacity=".2"/><path d="M18 25L17 3M79 24L78 2M12 6Q17 0 22 6M73 6Q78 0 83 6"/><path d="M16 44h11v12H16zM34 44h11v12H34zM52 44h11v12H52z"/><circle cx="78" cy="49" r="3" fill="#517274" stroke="none"/></g>
 <g id="apn-lateral-plc" fill="#f4f1e8" stroke="#454d43" stroke-width="2.2" stroke-linejoin="round"><path d="M6 7L87 5L89 68L7 70Z"/><path d="M24 7v61M45 7v61M66 7v61M7 56h80"/><path d="M12 16h6M12 23h6M12 30h6M30 16h8M30 23h8M51 16h8M51 23h8M72 16h8M72 23h8"/><path d="M11 76h73"/><circle cx="16" cy="41" r="3" fill="#517274" stroke="none"/></g>
 <g id="apn-lateral-fw" fill="#f4f1e8" stroke="#454d43" stroke-width="2.2" stroke-linecap="round"><path d="M7 10L88 8L90 64L8 67Z"/><path d="M8 28h81M8 46h81M28 10v18M68 9v19M48 28v18M29 46v20M69 46v19"/><path d="M19 75h59"/></g>
 <g id="apn-lateral-switch" fill="#f4f1e8" stroke="#454d43" stroke-width="2.2" stroke-linejoin="round"><path d="M4 23L18 9L87 11L98 26L96 60L6 62Z"/><path d="M5 25l92 1M18 10L28 25"/><path d="M15 39h12v11H15zM34 39h12v11H34zM53 39h12v11H53zM72 39h12v11H72z"/></g>
 <g id="apn-lateral-screen" fill="#f4f1e8" stroke="#454d43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5L91 3L93 60L5 62Z"/><path d="M12 13h72v40H12zM39 63v14M57 62v15M28 78h39"/><path d="M21 42v-9h14V22h15v20h24" stroke="#517274"/></g>
 <g id="apn-lateral-tower" fill="none" stroke="#454d43" stroke-width="2.2" stroke-linecap="round"><path d="M49 12L26 77M49 12L73 78M38 44h24M33 60h34M38 44l28 16M61 44L34 60"/><path d="M29 24Q11 10 29 0M69 24Q87 10 69 0M36 20Q26 10 36 4M62 20Q72 10 62 4"/></g></defs><rect width="1100" height="740" rx="18" fill="#f4f1e8"/><g font-family="Segoe UI, sans-serif" fill="#454d43"><text x="34" y="42" text-anchor="start" font-size="24" fill="#454d43" font-weight="bold">Merkezle haberleşme izni, tesisler arası yönetim izni mi?</text><text x="34" y="70" text-anchor="start" font-size="15" fill="#6d7466" font-weight="normal">CERT Polska olay incelemesinden sadeleştirilmiştir; bütün cihazları ve kablolamayı göstermez.</text><use xlink:href="#apn-lateral-screen" transform="translate(488 91) scale(0.82)"/><use xlink:href="#apn-lateral-fw" transform="translate(604 92) scale(0.82)"/><path d="M567 126L608 126" fill="none" stroke="#517274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-lateral-blue)"/><text x="453" y="109" text-anchor="end" font-size="16" fill="#454d43" font-weight="normal">Dağıtım</text><text x="453" y="134" text-anchor="end" font-size="16" fill="#454d43" font-weight="normal">işletmecisi</text><text x="453" y="160" text-anchor="end" font-size="16" fill="#454d43" font-weight="bold">Merkez SCADA</text><path d="M643 149L643 213L577 213L577 246" fill="none" stroke="#517274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-lateral-blue)"/><path d="M448 249Q443 218 479 217Q497 181 539 211Q578 184 602 217Q652 206 662 247Q694 273 659 303L450 302Q422 278 448 249Z" fill="#f4f1e8" stroke="#454d43" stroke-width="2.2"/><text x="548" y="253" text-anchor="middle" font-size="24" fill="#454d43" font-weight="bold">Özel APN</text><text x="548" y="280" text-anchor="middle" font-size="15" fill="#454d43" font-weight="normal">Operatör yönlendirmesi</text><path d="M450 277L347 277L347 406" fill="none" stroke="#517274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-lateral-blue)"/><path d="M659 277L771 277L771 406" fill="none" stroke="#517274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-lateral-blue)"/><text x="315" y="307" text-anchor="middle" font-size="15" fill="#517274" font-weight="normal">Telekontrol</text><text x="805" y="307" text-anchor="middle" font-size="15" fill="#517274" font-weight="normal">Telekontrol</text><path d="M34 354L477 352L479 660L35 663Z" fill="#f4f1e8" stroke="#8d9785" stroke-width="1.6" stroke-dasharray="8 7"/><path d="M631 352L1067 355L1065 662L632 659Z" fill="#f4f1e8" stroke="#8d9785" stroke-width="1.6" stroke-dasharray="8 7"/><text x="58" y="384" text-anchor="start" font-size="20" fill="#454d43" font-weight="bold">Tesis A / rüzgâr sahası</text><text x="654" y="384" text-anchor="start" font-size="20" fill="#454d43" font-weight="bold">Tesis B / kojenerasyon</text><use xlink:href="#apn-lateral-fw" transform="translate(92 415) scale(1)"/><use xlink:href="#apn-lateral-router" transform="translate(298 415) scale(1)"/><use xlink:href="#apn-lateral-plc" transform="translate(299 555) scale(1)"/><text x="133" y="512" text-anchor="middle" font-size="16" fill="#454d43" font-weight="bold">Firewall / VPN</text><text x="133" y="538" text-anchor="middle" font-size="15" fill="#984c42" font-weight="normal">Ele geçirilmiş</text><text x="345" y="512" text-anchor="middle" font-size="16" fill="#454d43" font-weight="bold">Mobil router</text><path d="M180 456L302 456" fill="none" stroke="#984c42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-lateral-red)"/><text x="239" y="441" text-anchor="middle" font-size="14" fill="#984c42" font-weight="normal">Ethernet</text><text x="239" y="480" text-anchor="middle" font-size="14" fill="#984c42" font-weight="normal">Yönetim</text><path d="M346 484L346 553" fill="none" stroke="#6d7466" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="321" y="541" text-anchor="end" font-size="14" fill="#6d7466" font-weight="normal">RS485 / DNP3</text><text x="345" y="648" text-anchor="middle" font-size="16" fill="#454d43" font-weight="bold">RTU</text><use xlink:href="#apn-lateral-plc" transform="translate(718 416) scale(1)"/><text x="767" y="511" text-anchor="middle" font-size="16" fill="#454d43" font-weight="bold">Kontrolör / gateway</text><text x="767" y="536" text-anchor="middle" font-size="14" fill="#984c42" font-weight="normal">APN’den yönetim erişimi</text><use xlink:href="#apn-lateral-switch" transform="translate(862 564) scale(0.82)"/><use xlink:href="#apn-lateral-plc" transform="translate(984 555) scale(0.68)"/><use xlink:href="#apn-lateral-screen" transform="translate(671 558) scale(0.82)"/><path d="M805 458L902 458L902 569" fill="none" stroke="#6d7466" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M863 599L751 599" fill="none" stroke="#6d7466" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M942 599L985 599" fill="none" stroke="#6d7466" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="709" y="648" text-anchor="middle" font-size="15" fill="#454d43" font-weight="normal">Yerel SCADA</text><text x="901" y="648" text-anchor="middle" font-size="15" fill="#454d43" font-weight="normal">Switch</text><text x="1023" y="648" text-anchor="middle" font-size="14" fill="#454d43" font-weight="normal">Proses / PLC</text><g class="apn-peer-route"><path d="M381 432L381 292L739 292L739 416" fill="none" stroke="#984c42" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#apn-lateral-red)"/><text x="552" y="347" text-anchor="middle" font-size="17" fill="#984c42" font-weight="bold">APN üzerinden yönetim yolu</text></g><text x="34" y="704" text-anchor="start" font-size="16" fill="#517274" font-weight="normal">Mavi: merkez–saha iletişimi</text><text x="437" y="704" text-anchor="start" font-size="16" fill="#984c42" font-weight="normal">Kırmızı: tesisler arası yönetim erişimi</text><text x="34" y="729" text-anchor="start" font-size="14" fill="#6d7466" font-weight="normal">Yerel ağa geçişte tünel kullanımı raporda olasılıklı yorumdur; erişim, cihazın yetenekleri ve izinlerine bağlıdır.</text></g></svg>